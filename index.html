<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-gradient"></div>
    <canvas id="stars-canvas"></canvas>

    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>

    <nav class="mode-nav" id="modeNav">
        <button class="mode-btn active" data-mode="clock">🕐 Reloj</button>
        <button class="mode-btn" data-mode="alarm">⏰ Alarma</button>
        <button class="mode-btn" data-mode="timer">⏱️ Temporizador</button>
        <button class="mode-btn" data-mode="stopwatch">⌛ Cronómetro</button>
    </nav>

    <main class="clock-card mode-panel active" id="panel-clock">
        <svg aria-hidden="true" style="position:absolute;width:0;height:0;">
            <defs>
                <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="var(--accent-1)" />
                    <stop offset="100%" stop-color="var(--accent-2)" />
                </linearGradient>
            </defs>
        </svg>

        <div class="seconds-ring" id="secondsRing">
            <svg viewBox="0 0 100 100">
                <circle class="track" cx="50" cy="50" r="46" />
                <circle class="progress" id="secProgress" cx="50" cy="50" r="46"
                    stroke-dasharray="289.03" stroke-dashoffset="289.03" />
            </svg>
        </div>

        <div class="clock-top-row">
            <h1 class="greeting" id="greeting">Cargando...</h1>
            <canvas id="analogCanvas" width="120" height="120"></canvas>
        </div>

        <div class="clock-display">
            <div class="time-block"><span class="time-num" id="hours">00</span></div>
            <span class="time-sep">:</span>
            <div class="time-block"><span class="time-num" id="minutes">00</span></div>
            <span class="time-sep">:</span>
            <div class="time-block"><span class="time-num" id="seconds">00</span></div>
            <span class="ampm" id="ampm">AM</span>
        </div>

        <p class="date-display" id="dateDisplay">Cargando...</p>

        <section class="info-bar">
            <div class="info-item">Semana <span id="weekNum">—</span></div>
            <div class="info-item">Día <span id="dayYear">—</span></div>
            <div class="info-item">Zona <span id="timezone">—</span></div>
        </section>
    </main>

    <main class="clock-card mode-panel" id="panel-alarm">
        <h1 class="greeting">⏰ Alarma</h1>
        <div class="alarm-setter">
            <div class="alarm-input-group">
                <label>Hora</label>
                <input type="number" id="alarmHour" min="1" max="12" value="7" class="alarm-input">
            </div>
            <span class="alarm-sep">:</span>
            <div class="alarm-input-group">
                <label>Minuto</label>
                <input type="number" id="alarmMin" min="0" max="59" value="0" class="alarm-input">
            </div>
            <div class="alarm-input-group">
                <label>AM/PM</label>
                <select id="alarmAmPm" class="alarm-select">
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
            </div>
        </div>
        <button class="alarm-toggle-btn" id="alarmToggleBtn">🔔 Activar Alarma</button>
        <p class="alarm-status" id="alarmStatus">Sin alarma activa</p>
        <p class="alarm-ring-display" id="alarmRingDisplay"></p>
        <div class="alarm-actions" id="alarmActions" style="display:none;">
            <button class="alarm-action-btn dismiss" id="alarmDismiss">✕ Desactivar</button>
            <button class="alarm-action-btn snooze" id="alarmSnooze">😴 Posponer 5 min</button>
        </div>
    </main>

    <main class="clock-card mode-panel" id="panel-timer">
        <h1 class="greeting">⏱️ Temporizador</h1>
        <div class="timer-setter">
            <div class="timer-input-group">
                <input type="number" id="timerH" min="0" max="99" value="0" class="alarm-input">
                <label>Horas</label>
            </div>
            <span class="alarm-sep">:</span>
            <div class="timer-input-group">
                <input type="number" id="timerM" min="0" max="59" value="5" class="alarm-input">
                <label>Min</label>
            </div>
            <span class="alarm-sep">:</span>
            <div class="timer-input-group">
                <input type="number" id="timerS" min="0" max="59" value="0" class="alarm-input">
                <label>Seg</label>
            </div>
        </div>
        <div class="timer-display" id="timerDisplay">05:00</div>
        <div class="timer-btns">
            <button class="alarm-toggle-btn" id="timerStartBtn">▶ Iniciar</button>
            <button class="alarm-action-btn dismiss" id="timerResetBtn">↺ Reiniciar</button>
        </div>
    </main>

    <main class="clock-card mode-panel" id="panel-stopwatch">
        <h1 class="greeting">⌛ Cronómetro</h1>
        <div class="timer-display" id="swDisplay">00:00:00.00</div>
        <div class="timer-btns">
            <button class="alarm-toggle-btn" id="swStartBtn">▶ Iniciar</button>
            <button class="alarm-action-btn dismiss" id="swLapBtn">📍 Vuelta</button>
            <button class="alarm-action-btn dismiss" id="swResetBtn">↺ Reiniciar</button>
        </div>
        <ul class="lap-list" id="lapList"></ul>
    </main>

    <div class="footer-credit">Rodríguez Condega Michael Antonio</div>

    <script src="script.js" defer></script>
</body>
</html>
